services:
  postgres:
    image: postgres:18.6
    container_name: biblioteca-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - biblioteca-data:/var/lib/postgresql
    networks:
      - biblioteca-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: biblioteca-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    networks:
      - biblioteca-network
    depends_on:
      - postgres

volumes:
  biblioteca-data:

networks:
  biblioteca-network:
    driver: bridge