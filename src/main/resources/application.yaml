spring:
  application:
    name: biblioteca

  data:
    web:
      pageable:
        max-page-size: 100

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:biblioteca_db}
    username: ${POSTGRES_USER:biblioteca}
    password: ${POSTGRES_PASSWORD:biblioteca}
    driver-class-name: org.postgresql.Driver

    hikari:
      pool-name: biblioteca-pool
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

server:
  forward-headers-strategy: framework

jwt:
  secret: ${JWT_SECRET}
  expiracao-minutos: 60

app:
  admin:
    email: ${ADMIN_EMAIL}
    senha: ${ADMIN_SENHA}