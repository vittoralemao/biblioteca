spring:
  application:
    name: biblioteca

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:biblioteca_db}
    username: ${POSTGRES_USER:biblioteca}
    password: ${POSTGRES_PASSWORD:biblioteca}
    driver-class-name: org.postgresql.Driver

    hikari:
      pool-name: biblioteca-pool
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET}
  expiracao-minutos: 60
